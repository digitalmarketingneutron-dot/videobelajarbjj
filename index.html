<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Video Viewer - Google Drive</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .main-card {
            width: 100%;
            max-width: 850px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .header-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
            color: #38bdf8;
            letter-spacing: 0.5px;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Overlay transparan hanya menutupi area atas/bawah tertentu, 
           atau kita gunakan CSS pointer-events agar tombol play bisa ditekan */
        .secure-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            background: transparent;
            /* Menggunakan CSS pointer-events: none, tapi diblokir via JS untuk klik kanan */
            pointer-events: none; 
        }

        .info-panel {
            margin-top: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #94a3b8;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 14px;
        }

        .badge {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <h1 class="header-title">Materi Pembelajaran Eksklusif</h1>
        
        <div class="video-wrapper">
            <div class="secure-overlay" id="secureOverlay"></div>
            
            <iframe 
                src="https://drive.google.com/file/d/1Wko7TLDM5jjGmWECxmJHYjYesGZbSTuz/preview" 
                allow="autoplay" 
                allowfullscreen>
            </iframe>
        </div>

        <div class="info-panel">
            <span>Status: Terlindungi (Protected Drive Stream)</span>
            <span class="badge">Secure Player v3.1</span>
        </div>
    </div>

    <script>
        // Mencegah klik kanan di area video secara keseluruhan
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // Mencegah shortcut keyboard untuk inspect element / save
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || (e.ctrlKey && ['u', 's', 'i', 'j'].includes(e.key.toLowerCase()))) {
                e.preventDefault();
                alert('Aksi ini dinonaktifkan demi keamanan materi.');
            }
        });
    </script>
</body>
</html>
