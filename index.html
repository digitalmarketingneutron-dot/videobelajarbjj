<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal E-Learning - Rekaman Kelas</title>
    <style>
        :root {
            --bg-main: #f1f5f9;
            --card-bg: #ffffff;
            --primary: #dc2626;
            --primary-hover: #b91c1c;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
            --success-color: #10b981;
            --warning-color: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container { width: 100%; max-width: 1000px; }

        /* LOGIN CARD PREMIUM */
        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 48px 36px;
            box-shadow: var(--shadow-lg);
            max-width: 440px;
            margin: 0 auto;
            transition: transform 0.3s ease;
        }

        .login-header { text-align: center; margin-bottom: 32px; }
        .logo-badge {
            display: inline-block;
            background: rgba(220, 38, 38, 0.1);
            color: var(--primary);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 14px;
        }
        .login-header h2 { font-size: 1.65rem; color: var(--text-main); font-weight: 800; letter-spacing: -0.5px; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; }
        .form-group input {
            width: 100%;
            padding: 14px 18px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-main);
            font-size: 0.95rem;
            transition: all 0.25s ease;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.1);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        }
        .btn:hover { background: var(--primary-hover); transform: translateY(-1px); }

        .error-msg { color: var(--primary); font-size: 0.85rem; text-align: center; margin-top: 16px; font-weight: 600; }

        /* LOADING OVERLAY MODERN */
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(6px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 16px;
        }
        .spinner {
            width: 52px; height: 52px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        .loading-text { font-size: 0.95rem; font-weight: 600; color: #ffffff; letter-spacing: 0.5px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* DASHBOARD UI */
        .dashboard { display: none; }
        
        .dash-header {
            background: var(--card-bg);
            padding: 24px 28px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .user-info h3 { font-size: 1.25rem; color: var(--text-main); font-weight: 800; letter-spacing: -0.3px; }
        .user-info span { 
            font-size: 0.8rem; color: var(--primary); background: rgba(220, 38, 38, 0.08); 
            padding: 5px 14px; border-radius: 50px; display: inline-block; margin-top: 8px; font-weight: 700; 
        }
        
        .logout-btn {
            background: #fee2e2; color: var(--primary);
            border: 1px solid #fecaca;
            padding: 10px 18px; border-radius: 12px;
            cursor: pointer; font-size: 0.85rem; font-weight: 700;
            transition: all 0.2s ease;
        }
        .logout-btn:hover { background: #fecaca; transform: translateY(-1px); }

        .video-container-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 28px;
            box-shadow: var(--shadow-lg);
        }

        .select-box { margin-bottom: 20px; }
        .select-box label { display: block; font-size: 0.85rem; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        .select-box select {
            width: 100%; padding: 14px 18px;
            background: #f8fafc; border: 1px solid var(--border-color);
            border-radius: 14px; color: var(--text-main); font-size: 0.95rem; font-weight: 600; outline: none; cursor: pointer;
            transition: all 0.2s;
        }
        .select-box select:focus { border-color: var(--primary); background: #fff; }

        .video-wrapper {
            position: relative; width: 100%; aspect-ratio: 16/9;
            background: #000; border-radius: 16px; overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        .video-wrapper iframe { width: 100%; height: 100%; border: none; }
        .block-popup { position: absolute; top: 0; right: 0; width: 90px; height: 70px; z-index: 20; background: transparent; }

        .video-meta-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 18px; padding-bottom: 18px; border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap; gap: 12px;
        }
        .status-badge {
            font-size: 0.85rem; font-weight: 700; padding: 6px 16px; border-radius: 50px;
            background: #f1f5f9; color: var(--text-muted); display: inline-flex; align-items: center; gap: 8px;
        }
        .status-badge.watched { background: rgba(16, 185, 129, 0.1); color: var(--success-color); }

        .action-buttons { display: flex; gap: 12px; }
        .action-btn {
            background: #f8fafc; border: 1px solid var(--border-color);
            padding: 8px 18px; border-radius: 12px; font-size: 0.9rem; font-weight: 700;
            color: var(--text-muted); cursor: pointer; display: flex; align-items: center; gap: 8px;
            transition: all 0.2s ease;
        }
        .action-btn:hover { background: #f1f5f9; }
        .action-btn.liked { background: rgba(220, 38, 38, 0.08); color: var(--primary); border-color: rgba(220, 38, 38, 0.2); }

        /* DISKUSI & RIWAYAT SECTION */
        .comment-section { margin-top: 24px; }
        .comment-section h4 { font-size: 1rem; font-weight: 800; color: var(--text-main); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        
        .comment-box { display: flex; gap: 10px; margin-bottom: 24px; }
        .comment-box input {
            flex: 1; padding: 14px 18px; background: #f8fafc;
            border: 1px solid var(--border-color); border-radius: 14px; font-size: 0.95rem; outline: none;
            transition: all 0.2s;
        }
        .comment-box input:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.08); }
        .comment-btn {
            background: var(--primary); color: #fff; border: none; padding: 0 24px;
            border-radius: 14px; font-size: 0.95rem; font-weight: 700; cursor: pointer; transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25);
        }
        .comment-btn:hover { background: var(--primary-hover); transform: translateY(-1px); }

        .history-list { display: flex; flex-direction: column; gap: 14px; max-height: 300px; overflow-y: auto; padding-right: 4px; }
        .history-card {
            background: #f8fafc; border: 1px solid var(--border-color);
            border-radius: 16px; padding: 16px 20px; font-size: 0.9rem;
            box-shadow: var(--shadow-sm);
        }
        .history-card .time { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
        .history-card .question { color: var(--text-main); font-weight: 600; margin-bottom: 10px; line-height: 1.4; }
        .history-card .reply {
            background: rgba(16, 185, 129, 0.08); border-left: 4px solid var(--success-color);
            padding: 12px 14px; border-radius: 0 12px 12px 0; color: #065f46; font-size: 0.85rem; line-height: 1.4;
        }
        .history-card .reply strong { display: block; margin-bottom: 4px; color: var(--success-color); font-weight: 700; }
        .history-card .pending-reply {
            background: rgba(245, 158, 11, 0.08); border-left: 4px solid var(--warning-color);
            padding: 12px 14px; border-radius: 0 12px 12px 0; color: #92400e; font-size: 0.85rem; font-weight: 600;
        }
        .no-history { text-align: center; color: var(--text-muted); font-size: 0.9rem; padding: 20px; background: #f8fafc; border-radius: 16px; border: 2px dashed var(--border-color); font-weight: 500; }

        .footer-note { text-align: center; font-size: 0.8rem; color: var(--text-muted); margin-top: 32px; font-weight: 500; }
    </style>
</head>
<body>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner"></div>
        <div id="loadingText" class="loading-text">Memproses sistem...</div>
    </div>

    <div class="container">
        <!-- FORM LOGIN -->
        <div id="loginSection" class="login-card">
            <div class="login-header">
                <span class="logo-badge">E-Learning Platform</span>
                <h2>Portal Rekaman Kelas</h2>
            </div>
            <div class="form-group">
                <label>Username Siswa</label>
                <input type="text" id="userInput" placeholder="Masukkan username anda...">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="passInput" placeholder="Masukkan password anda...">
            </div>
            <button class="btn" onclick="handleLogin()">Masuk Belajar</button>
            <div id="errorMsg" class="error-msg"></div>
        </div>

        <!-- DASHBOARD UTAMA -->
        <div id="dashboardSection" class="dashboard">
            <div class="dash-header">
                <div class="user-info">
                    <h3 id="welcomeText">Halo, Siswa</h3>
                    <span id="classText">Kelas: -</span>
                </div>
                <button class="logout-btn" onclick="handleLogout()">Keluar Akun</button>
            </div>

            <div class="video-container-box">
                <div class="select-box">
                    <label>Pilih Materi Pembelajaran</label>
                    <select id="videoSelect" onchange="onVideoChanged()"></select>
                </div>

                <div class="video-wrapper">
                    <div class="block-popup" title="Proteksi Materi"></div>
                    <iframe id="videoPlayer" src="" allow="autoplay" allowfullscreen></iframe>
                </div>

                <div class="video-meta-bar">
                    <div id="watchStatusBadge" class="status-badge">⏳ Belum Ditonton</div>
                    <div class="action-buttons">
                        <button id="likeBtn" class="action-btn" onclick="toggleLike()">❤️ <span id="likeCount">0</span> Suka</button>
                    </div>
                </div>

                <div class="comment-section">
                    <h4>💬 Forum Diskusi & Tanya Jawab</h4>
                    <div class="comment-box">
                        <input type="text" id="commentInput" placeholder="Tulis pertanyaan seputar materi video ini...">
                        <button class="comment-btn" onclick="sendCommentToSheet()">Kirim</button>
                    </div>

                    <h4>📜 Riwayat Pertanyaan Anda</h4>
                    <div id="historyList" class="history-list">
                        <div class="no-history">Belum ada riwayat pertanyaan untuk video ini.</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer-note">
            &copy; 2026 Portal Pembelajaran Terpadu. All rights reserved.
        </div>
    </div>

    <script>
        // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT ANDA DI SINI
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwg0JXaoE8aj1LUm-aNReGH83ayPP3uKjAhVXAhI4XY_ZkiX8rkPv-QRNPrxvpA5Gnk/exec';

        let cachedVideos = [];
        let currentStudent = null;
        let globalDatabase = null;

        function showLoading(text = "Memproses...") {
            document.getElementById('loadingText').innerText = text;
            document.getElementById('loadingOverlay').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        // Cek sesi tersimpan agar tidak logout saat refresh
        window.addEventListener('DOMContentLoaded', async () => {
            let savedUser = localStorage.getItem('elearn_logged_user');
            if (savedUser) {
                showLoading("Memulihkan sesi belajar...");
                try {
                    let response = await fetch(SCRIPT_URL);
                    let data = await response.json();
                    globalDatabase = data;

                    let student = data.siswa.find(s => s.username === savedUser);
                    if (student) {
                        if (student.isLocked) {
                            localStorage.removeItem('elearn_logged_user');
                            hideLoading();
                            return;
                        }

                        currentStudent = student;
                        document.getElementById('loginSection').style.display = 'none';
                        document.getElementById('dashboardSection').style.display = 'block';
                        document.getElementById('welcomeText').innerText = "Selamat datang, " + student.nama;
                        document.getElementById('classText').innerText = "Kelas Terdaftar: " + student.kelas.join(', ');

                        let allowedVideos = data.video.filter(v => student.kelas.includes(v.kelas));
                        setupVideoSelector(allowedVideos);
                    } else {
                        localStorage.removeItem('elearn_logged_user');
                    }
                } catch (error) {
                    console.error("Gagal memulihkan sesi", error);
                } finally {
                    hideLoading();
                }
            }
        });

        async function handleLogin() {
            let user = document.getElementById('userInput').value.trim();
            let pass = document.getElementById('passInput').value.trim();
            let errDiv = document.getElementById('errorMsg');

            if(!user || !pass) {
                errDiv.innerText = "Username dan password wajib diisi!";
                return;
            }

            errDiv.innerText = "";
            showLoading("Memeriksa kredensial akun...");

            try {
                let response = await fetch(SCRIPT_URL);
                let data = await response.json();
                globalDatabase = data;

                let student = data.siswa.find(s => s.username === user && s.password === pass);

                if(student) {
                    if (student.isLocked) {
                        hideLoading();
                        errDiv.innerText = "Akun Anda terkunci. Silakan hubungi admin untuk membuka akses.";
                        return;
                    }

                    currentStudent = student;
                    localStorage.setItem('elearn_logged_user', student.username);

                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('dashboardSection').style.display = 'block';
                    document.getElementById('welcomeText').innerText = "Selamat datang, " + student.nama;
                    document.getElementById('classText').innerText = "Kelas Terdaftar: " + student.kelas.join(', ');

                    let allowedVideos = data.video.filter(v => student.kelas.includes(v.kelas));
                    setupVideoSelector(allowedVideos);
                } else {
                    errDiv.innerText = "Username atau Password salah!";
                }
            } catch (error) {
                errDiv.innerText = "Gagal terhubung ke server sistem.";
            } finally {
                hideLoading();
            }
        }

        function setupVideoSelector(videos) {
            cachedVideos = videos;
            let select = document.getElementById('videoSelect');
            select.innerHTML = "";

            if(videos.length === 0) {
                select.innerHTML = "<option>Belum ada rekaman video untuk kelas Anda</option>";
                document.getElementById('videoPlayer').src = "";
                return;
            }

            videos.forEach((vid, index) => {
                let opt = document.createElement('option');
                opt.value = index;
                opt.innerText = "[" + vid.kelas + "] " + vid.judul;
                select.appendChild(opt);
            });

            loadSelectedVideoData(0);
        }

        function onVideoChanged() {
            let index = document.getElementById('videoSelect').value;
            loadSelectedVideoData(index);
        }

        function loadSelectedVideoData(index) {
            if(!cachedVideos[index]) return;
            let vid = cachedVideos[index];

            let fileId = extractDriveId(vid.url);
            document.getElementById('videoPlayer').src = "https://drive.google.com/file/d/" + fileId + "/preview";

            let videoKey = "watched_" + currentStudent.username + "_" + fileId;
            localStorage.setItem(videoKey, "true");
            updateWatchStatus(true);
            
            renderLikeStatus(vid);
            renderStudentHistory(vid);
        }

        function extractDriveId(url) {
            if (!url) return "";
            let match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return match[1];
            }
            return url.trim();
        }

        function renderLikeStatus(vid) {
            let fileId = extractDriveId(vid.url);
            let likedKey = "liked_" + currentStudent.username + "_" + fileId;
            let isLiked = localStorage.getItem(likedKey) === "true";

            let likeBtn = document.getElementById('likeBtn');
            if (isLiked) {
                likeBtn.classList.add('liked');
            } else {
                likeBtn.classList.remove('liked');
            }
            document.getElementById('likeCount').innerText = vid.likes || 0;
        }

        async function toggleLike() {
            let index = document.getElementById('videoSelect').value;
            let vid = cachedVideos[index];
            let fileId = extractDriveId(vid.url);
            
            let likedKey = "liked_" + currentStudent.username + "_" + fileId;
            let isLiked = localStorage.getItem(likedKey) === "true";

            let isAdd = !isLiked;
            localStorage.setItem(likedKey, isAdd ? "true" : "false");

            if (isAdd) {
                vid.likes = (vid.likes || 0) + 1;
            } else {
                vid.likes = Math.max(0, (vid.likes || 0) - 1);
            }
            renderLikeStatus(vid);

            try {
                let payload = {
                    action: "like",
                    judulVideo: "[" + vid.kelas + "] " + vid.judul,
                    isAdd: isAdd
                };

                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (error) {
                console.error("Gagal memperbarui like.");
            }
        }

        function renderStudentHistory(currentVideo) {
            let historyList = document.getElementById('historyList');
            historyList.innerHTML = "";

            if (!globalDatabase || !globalDatabase.komentar) {
                historyList.innerHTML = "<div class='no-history'>Belum ada riwayat pertanyaan.</div>";
                return;
            }

            let targetJudul = "[" + currentVideo.kelas + "] " + currentVideo.judul;
            
            let myComments = globalDatabase.komentar.filter(k => {
                if (!k.namaSiswa || !k.judulVideo) return false;
                let namaSpreadsheet = k.namaSiswa.toLowerCase().trim();
                let namaLogin = currentStudent.nama.toLowerCase().trim();
                let judulSpreadsheet = k.judulVideo.trim();
                let judulTarget = targetJudul.trim();

                return namaSpreadsheet === namaLogin && judulSpreadsheet === judulTarget;
            });

            if (myComments.length === 0) {
                historyList.innerHTML = "<div class='no-history'>Belum ada riwayat pertanyaan untuk video ini.</div>";
                return;
            }

            myComments.forEach(item => {
                let card = document.createElement('div');
                card.className = "history-card";
                
                let html = `<div class="time">🕒 ${item.waktu}</div>
                            <div class="question"><strong>Anda:</strong> ${item.pesan}</div>`;
                
                if (item.respon && item.respon.trim() !== "") {
                    html += `<div class="reply"><strong>Respon Pengajar:</strong> ${item.respon}</div>`;
                } else {
                    html += `<div class="pending-reply">⏳ Menunggu respon dari pengajar...</div>`;
                }

                card.innerHTML = html;
                historyList.appendChild(card);
            });
        }

        function updateWatchStatus(watched) {
            let badge = document.getElementById('watchStatusBadge');
            if(watched) {
                badge.className = "status-badge watched";
                badge.innerHTML = "✅ Selesai Ditonton";
            } else {
                badge.className = "status-badge";
                badge.innerHTML = "⏳ Belum Ditonton";
            }
        }

        async function sendCommentToSheet() {
            let input = document.getElementById('commentInput');
            let pesan = input.value.trim();
            if(!pesan) {
                alert("Pertanyaan tidak boleh kosong!");
                return;
            }

            let index = document.getElementById('videoSelect').value;
            let currentVideo = cachedVideos[index];

            showLoading("Mengirim pertanyaan ke pengajar...");

            try {
                let payload = {
                    action: "comment",
                    nama: currentStudent.nama,
                    judulVideo: "[" + currentVideo.kelas + "] " + currentVideo.judul,
                    pesan: pesan
                };

                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                input.value = "";

                setTimeout(async () => {
                    let response = await fetch(SCRIPT_URL);
                    globalDatabase = await response.json();
                    renderStudentHistory(currentVideo);
                    hideLoading();
                    alert("Pertanyaan berhasil terkirim!");
                }, 1500);

            } catch (error) {
                hideLoading();
                alert("Gagal mengirim pertanyaan. Silakan coba lagi.");
            }
        }

        function handleLogout() {
            localStorage.removeItem('elearn_logged_user');
            currentStudent = null;
            globalDatabase = null;
            document.getElementById('dashboardSection').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('userInput').value = '';
            document.getElementById('passInput').value = '';
            document.getElementById('errorMsg').innerText = '';
            document.getElementById('videoPlayer').src = '';
        }

        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && ['u', 's', 'i', 'j'].includes(e.key.toLowerCase()))) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
