<!-- KONTEN UTAMA DI KANAN (VIDEO & PDF BERSEBELAHAN DI PC) -->
                    <div class="right-content-area">
                        <div class="video-container-box">
                            
                            <!-- Pembungkus Flex Grid Video & PDF -->
                            <div class="media-pdf-flex-container">
                                
                                <!-- Kolom Kiri: Video -->
                                <div>
                                    <div class="section-title-small">▶ Rekaman Video Pembelajaran</div>
                                    <div class="media-wrapper" id="mediaBox">
                                        <div class="block-popup" title="Proteksi Video"></div>
                                        <iframe id="mediaPlayer" src="" allow="autoplay" allowfullscreen></iframe>
                                    </div>
                                    <div class="fullscreen-bar">
                                        <button class="fs-btn" onclick="toggleFullscreen()">Perbesar Layar (Full Screen)</button>
                                    </div>
                                </div>

                                <!-- Kolom Kanan: PDF Otomatis -->
                                <div>
                                    <div id="pdfContainerSection" class="pdf-section-wrapper">
                                        <div class="section-title-small">📄 Dokumen Materi Pembelajaran (PDF)</div>
                                        <div class="pdf-wrapper" id="pdfBox">
                                            <div class="block-popup" title="Proteksi Dokumen"></div>
                                            <iframe id="pdfPlayer" src=""></iframe>
                                        </div>
                                    </div>
                                    <div id="pdfEmptyNotice" class="pdf-empty-notice" style="display: none;">Tidak ada dokumen PDF untuk materi ini.</div>
                                </div>

                            </div>

                            <!-- Status & Tombol Suka -->
                            <div class="video-meta-bar" style="margin-top: 20px;">
                                <div id="watchStatusBadge" class="status-badge">Status: Belum Ditonton</div>
                                <div class="action-buttons">
                                    <button id="likeBtn" class="action-btn" onclick="toggleLike()">Suka (<span id="likeCount">0</span>)</button>
                                </div>
                            </div>

                            <!-- Forum Diskusi & Tanya Jawab -->
                            <div class="comment-section">
                                <h4>Forum Diskusi dan Tanya Jawab</h4>
                                <div class="comment-box">
                                    <input type="text" id="commentInput" placeholder="Tulis pertanyaan seputar materi ini...">
                                    <div class="comment-btn-wrapper">
                                        <button id="commentSubmitBtn" class="comment-btn" onclick="sendCommentToSheet()">Kirim</button>
                                        <div id="commentLoading" class="comment-loading">
                                            <div class="comment-spinner"></div>
                                            <span>Mengirim...</span>
                                        </div>
                                    </div>
                                </div>

                                <h4>Riwayat Pertanyaan Anda</h4>
                                <div id="historyList" class="history-list">
                                    <div class="no-history">Belum ada riwayat pertanyaan untuk materi ini.</div>
                                </div>
                            </div>

                        </div>
                    </div>
